<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TravelSARD – Entdecke die Welt</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">

    <div class="logo">
      🌍 TravelSARD
    </div>

    <nav>
      <a href="#" id="homeLink">Home</a>
      <a href="#countries">Länder</a>
    </nav>

  </header>


  <main>

    <!-- STARTSEITE -->

    <section id="homePage" class="page">

      <div class="hero">

        <h1>Entdecke die Welt 🌎</h1>

        <p>
          Suche ein Land und entdecke seine Geschichte,
          Kultur, Sehenswürdigkeiten und vieles mehr.
        </p>


        <div class="searchBox">

          <input
            id="countrySearch"
            type="text"
            placeholder="Suche ein Land..."
            autocomplete="off"
          >

          <button id="searchButton">
            🔎 Suchen
          </button>

        </div>


        <div id="searchResults"></div>

      </div>


      <!-- WELTKARTE -->

      <section class="mapSection">

        <h2>🗺️ Die Welt entdecken</h2>

        <div id="worldMap">
          <div class="mapMessage">
            Wähle ein Land aus der Liste oder benutze die Suche.
          </div>
        </div>

      </section>


      <!-- ALLE LÄNDER -->

      <section id="countries" class="countriesSection">

        <h2>🌎 Alle Länder</h2>

        <div id="countryList" class="countryGrid"></div>

      </section>

    </section>


    <!-- LÄNDERSEITE -->

    <section
      id="countryPage"
      class="page hidden"
    >

      <button id="backButton" class="backButton">
        ← Zurück zu den Ländern
      </button>


      <div id="countryContent"></div>

    </section>

  </main>


  <footer>

    <p>
      © 2026 TravelSARD
    </p>

  </footer>


  <script src="countries.js"></script>
  <script src="script.js"></script>

</body>
</html>
